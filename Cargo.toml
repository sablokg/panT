[package]
name = "pant"
version = "0.1.0"
edition = "2024"
readme = "README.md"
license = "MIT"
authors = ["Gaurav Sablok"]
description = "pan transcript for transcriptomics"
homepage = "https://codeberg.org/gsablok/pantranscript"
repository = "https://codeberg.org/gsablok/transcript"
keywords = ["bioinformatics","genomics"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rayon = "1.12.0"
tokio = { version = "1.52.3", features = ["full"] }
vornix-banner = "0.0.1"
